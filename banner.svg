<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <style>
      .t { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
      .cur { animation: pisca 1s steps(1) infinite; }
      @keyframes pisca { 50% { opacity: 0; } }
      .orb { animation: flutua 7s ease-in-out infinite; }
      .orb2 { animation: flutua 9s ease-in-out infinite reverse; }
      @keyframes flutua { 50% { transform: translateY(-14px); } }
      .linha { stroke-dasharray: 520; stroke-dashoffset: 520; animation: risca 2.4s ease-out forwards; }
      @keyframes risca { to { stroke-dashoffset: 0; } }
    </style>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)" opacity="0.55"/>

  <circle class="orb" cx="1010" cy="110" r="90" fill="#a78bfa" opacity="0.13"/>
  <circle class="orb2" cx="1100" cy="210" r="60" fill="#22d3ee" opacity="0.12"/>
  <circle class="orb" cx="930" cy="230" r="40" fill="#f472b6" opacity="0.12"/>

  <g class="t">
    <text x="70" y="88" fill="#64748b" font-size="22" font-family="Consolas, 'Courier New', monospace">&gt; olá, mundo_</text>
    <text x="66" y="160" fill="url(#neon)" font-size="72" font-weight="800" filter="url(#glow)">Paulo Levi</text>
    <line class="linha" x1="70" y1="182" x2="590" y2="182" stroke="url(#neon)" stroke-width="3" stroke-linecap="round"/>
    <text x="70" y="226" fill="#e2e8f0" font-size="26" font-weight="600">Dev de jogos, web e C#</text>
    <text x="70" y="262" fill="#94a3b8" font-size="19">Unity · TypeScript · .NET · tudo gerado por código, do zero</text>
  </g>

  <g transform="translate(905 85)" font-family="Consolas, 'Courier New', monospace" font-size="17">
    <rect x="0" y="0" width="230" height="130" rx="10" fill="#0b1220" stroke="#334155"/>
    <circle cx="18" cy="16" r="5" fill="#f87171"/><circle cx="34" cy="16" r="5" fill="#fbbf24"/><circle cx="50" cy="16" r="5" fill="#34d399"/>
    <text x="16" y="52" fill="#22d3ee">git</text><text x="52" y="52" fill="#e2e8f0">commit -m</text>
    <text x="16" y="78" fill="#a78bfa">"mais um</text>
    <text x="16" y="104" fill="#a78bfa">jogo pronto"</text><rect class="cur" x="146" y="90" width="10" height="18" fill="#f472b6"/>
  </g>
</svg>
